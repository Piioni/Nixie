strict_tdd: false
context: |
  nixie is a NixOS configuration flake for personal workstations, with
  Home Manager integrated for the user environment. It is a solo personal
  repository: no team, no CI workflows, no release process.

  Target: /home/piioni/Repos/Nixie.
  Host: nixosConfigurations.desktop (x86_64-linux).
  Pinned inputs: nixpkgs-unstable rev 56c02bc00adc (2026-08-23) and
  home-manager/master rev afa6821c7056 (2026-09-17).

  Repository shape:
  - flake.nix declares the single host, a `nixfmt` formatter, and a
    `nixd` + `nixfmt` devShell. `specialArgs.homeManager` carries the
    Home Manager input to the host module.
  - hosts/desktop/ holds default.nix (composition), host.nix (hostname
    and `system.stateVersion = "25.11"`), and gpu-nvidia.nix (NVIDIA and
    Wayland hardware support).
  - modules/ is the system layer: default.nix -> desktop.nix ->
    modules/base/ (fonts, locale, networking, nix, packages, ssh,
    users) and modules/desktop/ (audio, fonts). modules/home-manager.nix
    wires `home-manager.users.piioni = import ../home/piioni`.
  - home/piioni/ is the Home Manager ownership boundary: 21 .nix modules
    plus 77 payload files (raw migrated configuration kept verbatim).
    It currently exposes 50 `home.file` targets.
  - Conventions: two-space indentation, kebab-case filenames,
    function-header modules `{ ... }:`, narrow single-concern modules,
    explicit imports in aggregate `default.nix` files. AGENTS.md is the
    authoritative contributor guide and takes precedence for style.

  Testing and verification capabilities (important, and unusual):
  - There is NO unit test framework in this repository, and none should
    be introduced for Nix module configuration. NixOS module definitions
    are declarative and are not exercised by unit tests.
  - STRICT TDD IS NOT APPLICABLE here. There is no meaningful RED/GREEN
    cycle: module evaluation is not a behaviour test, and much of the
    surface is data (fonts, packages, file contents) whose only failure
    mode is a Nix evaluation error. Do not fabricate a RED/GREEN cycle;
    report that TDD is not applicable instead.
  - The real verification surface is Nix evaluation plus the nixfmt
    formatting gate. Both halves are proven real, not assumed:
      * The evaluation gate is GREEN on the current clean tree and RED
        on injected breakage. Verified with a deliberately broken module,
        which failed as `error: expected a set but found an integer: 42`.
      * `nixfmt --check` exits 1 with `<file>: not formatted` on
        deliberately misformatted input.
  - `nix flake check` DOES NOT WORK today and must never be used as a
    gate. It forces `system.build.toplevel` directly and fails on
    pre-existing assertions, because
    hosts/desktop/hardware-configuration.nix is intentionally absent
    (the machine is not installed yet):

      Failed assertions:
       - The 'fileSystems' option does not specify your root file
         system.
       - You must set the option 'boot.loader.grub.devices' or
         'boot.loader.grub.mirroredBoots' to make the system bootable.

  - An equivalent strong gate IS reachable today, without modifying the
    repository, by evaluating `system.build.toplevel.drvPath` on
    `nixosConfigurations.desktop.extendModules { modules = [ stub ]; }`
    where the stub supplies only `fileSystems."/".device`,
    `fileSystems."/".fsType`, `boot.loader.grub.enable`,
    `boot.loader.grub.devices`, and `nixpkgs.config.allowUnfree = true`.
    This forces the whole NixOS module system and every remaining
    assertion, and yields
    `nixos-system-desktop-26.11.20260823.56c02bc.drv`. The stub is
    evaluation-only and must never be committed to the repository.
  - HARD Nix/Git constraint that shapes every gate: this flake lives in a
    Git repository, so Nix cannot see paths that are not tracked by Git.
      * Modifying an already-tracked file IS visible to `nix eval` (Nix
        prints `warning: Git tree ... is dirty` and evaluates the
        working tree).
      * Adding a NEW untracked file fails hard:
        `error: Path 'modules/base/probe.nix' in the repository is not
        tracked by Git.`
    SDD changes routinely add new module files, so a gate must evaluate a
    non-Git copy of the working tree
    (`rsync -a --exclude .git --exclude references ./ <tmp>/`) or the
    tree must be committed first. The rsync copy also correctly sees
    untracked files.
  - Evaluation is slow (tens of seconds to minutes). Iterate with
    targeted `nix eval` on specific option paths, then run the full
    toplevel gate before declaring work complete.
  - Pre-existing warning noise, not a failure:
    `programs.yazi.shellWrapperName` keeps the legacy default `"yy"`
    because `home.stateVersion` (25.11) is below "26.05".
  - Stale drift: `.vscode/settings.json` points nixd options at
    `nixosConfigurations.piioni.options`, but no `piioni` configuration
    exists (only `desktop`). `.zed/settings.json` correctly targets
    `desktop`. Treat the VS Code entry as drift, not as a second host.

  Skill registry:
  - `.atl/skill-registry.md` exists (generated 2026-09-17) and is
    gitignored along with the rest of `.atl/`. It indexes user-scoped
    skills only.
  - This project has NO project-local skills directory: no
    `openspec/skills/`, and no repository `.atl/` content beyond the
    generated registry and its cache.

  Autodetection caveat: gentle-pi's generic stack detector misreads this
  repository. It scans the gitignored-but-present `references/` tree
  (613 vendored files, including .py helpers and example `tests/`
  directories) and reports a Python project with test-like files. Nix,
  NixOS, and Home Manager are NOT detected. `references/` holds external
  examples to learn from and is never the default edit target. Do not
  trust autodetected stack or test information for this repository; use
  this file instead.

  Change sizing and delivery:
  - AGENTS.md asks for minimal, surgical edits. hosts/desktop/ and
    modules/ are the default edit targets; `references/` is not.
  - AGENTS.md verification order: `nix flake show`, then
    `sudo nixos-rebuild build --flake .#desktop`, then
    `sudo nixos-rebuild test --flake .#desktop`. Only `nix flake show`
    (which does not force the toplevel) can run in this environment;
    activation commands need the target machine and must be reported as
    unverifiable when they cannot run.

  Planned change (background only; not yet specified or tasked):
  An architecture refactor targeting 2-3 workstations. It intends to add
  a per-host seam (a `lib/mkWorkstation.nix` helper plus a per-host
  composition file), move NVIDIA support out of hosts/desktop/ into a
  reusable `modules/hardware/nvidia.nix`, split the Home Manager profile
  into `base` and `gui` roles plus per-host overrides, turn the hardcoded
  Hyprland monitor configuration (the eDP-1 and HDMI-A-1 blocks in
  home/piioni/hypr/lua/monitors.lua) into per-host data, and add an
  evaluation gate script. That change adds new module files, so it is
  directly exposed to the Git tracking constraint above.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: |-
      set -e
      D="$(mktemp -d)"
      trap 'rm -rf "$D"' EXIT
      rsync -a --exclude .git --exclude references ./ "$D/t/"
      nix eval --raw --impure --expr "
      let
        f = builtins.getFlake \"$D/t\";
        stub = {
          fileSystems.\"/\".device = \"/dev/null\";
          fileSystems.\"/\".fsType = \"ext4\";
          boot.loader.grub.enable = true;
          boot.loader.grub.devices = [ \"/dev/null\" ];
          nixpkgs.config.allowUnfree = true;
        };
      in
      (f.nixosConfigurations.desktop.extendModules { modules = [ stub ]; })
        .config.system.build.toplevel.drvPath" > /dev/null
  verify:
    test_command: |-
      set -e
      D="$(mktemp -d)"
      trap 'rm -rf "$D"' EXIT
      rsync -a --exclude .git --exclude references ./ "$D/t/"
      nix eval --raw --impure --expr "
      let
        f = builtins.getFlake \"$D/t\";
        stub = {
          fileSystems.\"/\".device = \"/dev/null\";
          fileSystems.\"/\".fsType = \"ext4\";
          boot.loader.grub.enable = true;
          boot.loader.grub.devices = [ \"/dev/null\" ];
          nixpkgs.config.allowUnfree = true;
        };
      in
      (f.nixosConfigurations.desktop.extendModules { modules = [ stub ]; })
        .config.system.build.toplevel.drvPath" > /dev/null
      nix run ".#formatter.x86_64-linux" -- --check $(git ls-files "*.nix")
testing:
  detected: "2026-09-21"
  runner:
    framework: >-
      nix eval: NixOS toplevel evaluation via extendModules with a
      synthetic boot stub (git-independent working-tree copy)
    command: |-
      set -e
      D="$(mktemp -d)"
      trap 'rm -rf "$D"' EXIT
      rsync -a --exclude .git --exclude references ./ "$D/t/"
      nix eval --raw --impure --expr "
      let
        f = builtins.getFlake \"$D/t\";
        stub = {
          fileSystems.\"/\".device = \"/dev/null\";
          fileSystems.\"/\".fsType = \"ext4\";
          boot.loader.grub.enable = true;
          boot.loader.grub.devices = [ \"/dev/null\" ];
          nixpkgs.config.allowUnfree = true;
        };
      in
      (f.nixosConfigurations.desktop.extendModules { modules = [ stub ]; })
        .config.system.build.toplevel.drvPath" > /dev/null
  layers:
    unit: ""
    integration: ""
    e2e: ""
  commands:
    # No test suites exist. The single project gate lives in
    # testing.runner.command; this repository has no unit, integration,
    # or e2e test suite to enumerate.
    unit: []
    integration: []
    e2e: []
  blocked_checks:
    - name: "nix flake check"
      command: "nix flake check --no-build"
      status: "blocked"
      reason: >-
        Forces system.build.toplevel without a boot stub and fails on
        pre-existing assertions: 'fileSystems' does not specify your
        root file system, and boot.loader.grub.devices is unset.
        hosts/desktop/hardware-configuration.nix is intentionally absent
        because the machine is not installed yet. Use the extendModules
        evaluation gate in testing.runner.command instead.
    - name: "nixos-rebuild build/test/switch"
      command: "sudo nixos-rebuild build --flake .#desktop"
      status: "manual-only"
      reason: >-
        Requires the target machine and privileged activation. Must be
        reported as unverified when it cannot run in the working
        environment.
  known_eval_traps:
    - >-
      Targeted `nix eval` only detects errors in option paths that are
      actually forced. A broken module that is imported but whose options
      are never read passes silently: forcing
      `builtins.attrNames config` (54 top-level options) did NOT catch an
      injected `builtins.attrNames 42` error, while forcing
      `config.environment.sessionVariables` did. This is why the gate
      forces system.build.toplevel.
    - >-
      `builtins.deepSeq config` forces the whole config but fails on
      unrelated unfree-license and derivation errors, so it is unusable
      as a gate.
    - >-
      Untracked new files are invisible to Nix. The gate must evaluate a
      non-Git copy of the working tree.
    - >-
      `nix run .#formatter` fails with "attribute 'formatter.type' does
      not exist"; the system-qualified `nix run
      .#formatter.x86_64-linux` form is required.
  coverage:
    command: ""
    commands: []
quality:
  lint: ""
  lint_commands: []
  typecheck: ""
  typecheck_commands: []
  format: "nixfmt --check"
  format_commands:
    - scope: "."
      command: |-
        nix run .#formatter.x86_64-linux -- --check $(git ls-files "*.nix")
      framework: "nixfmt (flake formatter, nixfmt 1.4.0)"
